#set $gigabyte_display 'GIGA-BYTE TECHNOLOGY CO., LTD. Gigabyte M32U '
#set $gigabyte_display 'GIGA-BYTE TECHNOLOGY CO., LTD. Gigabyte M32U 0x01010101'
#set $ktc_l_display 'Shenzhen KTC Technology Group H24T7 0x00000001'
#set $msi_display 'Microstep MSI MP223 PB9H164201287'
set $gigabyte_display HDMI-A-1
set $ktc_l_display DP-1
set $ktc_r_display DP-2

output $ktc_l_display {
  mode 2560x1440@119.989Hz
  adaptive_sync on
  max_render_time 1
  position 0 0
  scale 1.0
  transform 270
}

output $ktc_r_display {
  mode 2560x1440@119.989Hz
  adaptive_sync on
  max_render_time 1
  position 5280 0
  scale 1.0
  transform 90
}

output $gigabyte_display {
  mode 3840x2160@120Hz
  adaptive_sync on
  position 1440 180
}
